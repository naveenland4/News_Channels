name: M3U generator

on:
  schedule:
    - cron: '0 */2 * * *'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yt-dlp
        run: |
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Load YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/cookies.txt
            echo "Cookies loaded."
          else
            echo "No YT_COOKIES secret set; continuing without cookies."
          fi

      - name: Git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Main
        run: |
          pwd
          chmod +x autorun.sh
          ./autorun.sh
          rm -f /tmp/cookies.txt

- name: Commit & push
        run: |
          if [ ! -s news_channels.m3u ]; then
            echo "news_channels.m3u is empty; skipping commit."
            exit 1
          fi
          git add -A
          ls -la
          if ! git diff --staged --quiet; then
            git commit -m "links are updated"
            git push -f
          else
            echo "No changes to commit."
          fi
